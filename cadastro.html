<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Inscrição para Evento</title>

    <link rel="stylesheet" href="assets/css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script>
    const supabaseClient =supabase.createClient(
    "https://mxadxpzrmnszzrxfgxyc.supabase.co",
    "sb_publishable_vRBoSsDRe_phd-kZ0wy5Rw_4EXRkp99"    
    );
    </script>
</head>


<body>

    <nav>
      
        <a href="index.html">Inicio</a> 
        <a href="cadastro.html">Cadastro</a> 
        <a href="eventos.html">Eventos </a> 

    </nav>

    <div class="header">
        <h1>Inscrição para o Evento</h1>
        <p>23/07/2026 - Teatro Colégio Londrinense - Londrina/PR</p>
    </div>

    <div class="container">
        <form id="formCadastro">

            <label>Nome completo:</label>
            <input type="text" name="nome" required>

            <label>E-mail:</label>
            <input type="email" name="email" required>

            <label>Telefone:</label>
            <input type="tel" name="telefone">

            <label>Data de nascimento:</label>
            <input type="date" name="nascimento">

            <label>Área de atuação:</label>
            <select name="atuacao">
                <option>Estudante</option>
                <option>Desenvolvedor</option>
                <option>Profissional de TI</option>
                <option>Empreendedor</option>
                <option>Outro</option>
            </select>

            <label>Qual atividade você tem mais interesse?</label>
            <div class="inline">
                <input type="radio" name="interesse" value="Ia"> Palestras sobre Inteligência Artificial
            </div>
            <div class="inline">
                <input type="radio" name="interesse" value="Mobile"> Workshop de Desenvolvimento Mobile
            </div>
            <div class="inline">
                <input type="radio" name="interesse" value="Ambos"> Ambos
            </div>

            <label>Como ficou sabendo do evento?</label>
            <div class="inline">
                <input type="checkbox" name="origem[]" value="Instagram"> Instagram
            </div>
            <div class="inline">
                <input type="checkbox" name="origem[]" value="Faculdade"> Faculdade / Escola
            </div>
            <div class="inline">
                <input type="checkbox" name="origem[]" value="Amigos"> Amigos
            </div>
            <div class="inline">
                <input type="checkbox" name="origem[]" value="Internet"> Internet
            </div>
            <div class="inline">
            <input type="checkbox" id="outrosCheck" onclick="toggleOutros()"  name="origem[]" value="Outros" > Outros 
            </div>

            <input type="text" id="campoOutros" name="outrosTexto" placeholder="Digite aqui..." disabled>

        
           



            <label>Observações ou expectativas:</label>
            <textarea name="observacoes" rows="4"></textarea>

            <input type="hidden" name="_subject" value="Nova inscrição - DevTech">

            <button type="submit" id="btnEnviar">Confirmar inscrição</button>

            <!-- Botão de voltar -->
            <a href="index.html" class="btn-voltar">Voltar para a página inicial</a>

        </form>
    </div>
<script>
document.addEventListener("DOMContentLoaded", function () {
 
    const form = document.getElementById("formCadastro");
    const botao = document.getElementById("btnEnviar");
 
    form.addEventListener("submit", async function (e) {
        e.preventDefault();
 
        botao.disabled = true;
        botao.innerText = "Enviando...";
 
        const formData = new FormData(form);
 
const dados = {
    nome: formData.get("nome"),
    email: formData.get("email"),
    telefone: formData.get("telefone"),
    nascimento: formData.get("nascimento"),
    atuacao: formData.get("atuacao"),
    interesse: formData.get("interesse"),
    fonte: formData.getAll("origem[]").join(", "),
    fonte_outros: formData.get("outrosTexto"),
    outros: formData.get("outros")
};
 
        try {
            const { error } = await supabaseClient
                .from("Cadastro")
                .insert([dados]);
 
           if (error) { 
             
                 alert(error.message);
                 return;
             
                }

        } catch (err) {
            console.error(err);
            alert("Erro ao salvar no banco.");
        }
 
        botao.disabled = false;
        botao.innerText = "Confirmar Inscrição";
    });
 
});
</script>
 <script src="assets/js/script.js"></script>
</body>
</html>
